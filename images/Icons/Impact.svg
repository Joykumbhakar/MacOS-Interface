<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1a38"/>
      <stop offset="100%" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#786120" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#786120" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#786120" stroke-width="2"/>
  
  <!-- Journey steps / roadmap visualization inside icon -->
  <!-- Top gold line & glowing dot -->
  <path d="M24 32 L104 32" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="64" cy="32" r="4" fill="#fbbf24" filter="url(#glow)"/>
  
  <!-- Stage cards inside icon -->
  <rect x="20" y="46" width="88" height="20" rx="6" fill="#13234d" stroke="#786120" stroke-width="1"/>
  <rect x="26" y="51" width="22" height="10" rx="4" fill="#3b82f6"/>
  <rect x="76" y="51" width="26" height="10" rx="4" fill="#22c55e"/>

  <!-- Vertical connector line -->
  <line x1="37" y1="66" x2="37" y2="76" stroke="#f59e0b" stroke-width="1.5"/>

  <rect x="20" y="76" width="88" height="20" rx="6" fill="#13234d" stroke="#786120" stroke-width="1"/>
  <rect x="26" y="81" width="22" height="10" rx="4" fill="#3b82f6"/>
  <rect x="76" y="81" width="26" height="10" rx="4" fill="#22c55e"/>

  <!-- Connector line -->
  <line x1="37" y1="96" x2="37" y2="104" stroke="#786120" stroke-width="1.5"/>
  <rect x="20" y="104" width="88" height="14" rx="5" fill="#13234d" stroke="#786120" stroke-width="1"/>
  <rect x="26" y="108" width="22" height="6" rx="3" fill="#3b82f6"/>
</svg>
