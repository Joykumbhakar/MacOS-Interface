<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slider and Toggle Components</title>
<style>
/* 
 * Slider Styles
 */
/* Custom Range Slider with Liquid Jelly Knob (Settings App) */
input[type="range"].settings-slider {
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
    height: 22px;
    caret-color: transparent !important;
    color: transparent !important;
    user-select: none;
    -webkit-user-select: none;
    width: 100%;
    max-width: 250px; /* added for display */
}

input[type="range"].settings-slider:focus,
input[type="range"].settings-slider:focus-visible,
input[type="range"].settings-slider:focus-within {
    outline: none !important;
    box-shadow: none !important;
    caret-color: transparent !important;
}

input[type="range"].settings-slider::-webkit-slider-runnable-track {
    border: none;
    width: 100%;
    height: 6px;
    background: linear-gradient(to right, #0a84ff var(--value, 50%), #e5e5ea var(--value, 50%));
    border-radius: 100px;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.15), inset 0 0 0 0.5px rgba(0,0,0,0.05);
}

input[type="range"].settings-slider::-webkit-slider-thumb {
    border: none;
    -webkit-appearance: none;
    appearance: none;
    margin-top: -6px; /* (18 - 6) / 2 = 6 */
    width: 24px;
    height: 18px;
    border-radius: 50px;
    
    /* Exact Liquid Knob Styling */
    background: 
        linear-gradient(to bottom, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.1) 45%, transparent 50%),
        linear-gradient(to top, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 40%, transparent 50%),
        rgba(255, 255, 255, 0.9);
        
    box-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.2), 
        0 0 0 0.5px rgba(0, 0, 0, 0.1),
        inset 0 1px 2px rgba(255, 255, 255, 0.8),
        inset 0 -1px 2px rgba(0, 0, 0, 0.1);
        
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: transform 0.2s cubic-bezier(0.4, 1.2, 0.5, 1), width 0.2s cubic-bezier(0.4, 1.2, 0.5, 1);
}

/* Liquid Jelly Active Press State */
input[type="range"].settings-slider:active::-webkit-slider-thumb {
    width: 28px;
    transform: scale(1.15);
}


/* 
 * Toggle Switch Styles (Liquid Glass Toggle)
 */
.toggle-wrapper {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 22px;
    flex-shrink: 0;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.toggle-input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    margin: 0;
    pointer-events: none;
}

.toggle-track {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #e5e5ea;
    border-radius: 100px;
    transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    box-shadow: 
        inset 0 2px 5px rgba(0, 0, 0, 0.15),
        inset 0 1px 2px rgba(0, 0, 0, 0.1) !important;
    border: none !important;
}

.toggle-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 24px;
    height: 18px;
    border-radius: 50px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: transform 0.5s cubic-bezier(0.34, 1.8, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.8, 0.64, 1);
    transform: translateX(0);
    box-shadow:
        inset 0 1px 1.5px rgba(255, 255, 255, 0.95),
        inset 0 -1px 2px rgba(255, 255, 255, 0.4),
        inset 0 0 3px rgba(255, 255, 255, 0.8),
        0 1px 2px rgba(0, 0, 0, 0.12) !important;
    z-index: 1;
    border: none !important;
}

/* Top curved glossy reflection */
.toggle-knob::before {
    content: '';
    position: absolute;
    top: 1px;
    left: 2px; 
    right: 2px;
    height: 48%;
    border-radius: 12px 12px 28px 28px / 10px 10px 6px 6px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.1) 100%);
    pointer-events: none;
}

/* Bottom ambient light rim */
.toggle-knob::after {
    content: '';
    position: absolute;
    bottom: 1px;
    left: 2px; 
    right: 2px;
    height: 35%;
    border-radius: 28px 28px 12px 12px / 6px 6px 10px 10px;
    background: linear-gradient(to top, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
}

/* Checked Track State */
.toggle-input:checked ~ .toggle-track,
.toggle-input:checked + .toggle-track {
    background-color: #34c759 !important;
    box-shadow: 
        inset 0 2px 5px rgba(0, 0, 0, 0.2),
        inset 0 1px 2px rgba(0, 0, 0, 0.15) !important;
}

/* Checked Knob Translation */
.toggle-input:checked ~ .toggle-knob,
.toggle-input:checked ~ .toggle-track .toggle-knob,
.toggle-input:checked + .toggle-track .toggle-knob {
    transform: translateX(16px) scale(1);
}

/* Liquid Jelly Active Press States */
.toggle-wrapper:active .toggle-knob {
    width: 28px;
    transform: translateX(-3px) scale(1.26);
    transition: width 0.25s cubic-bezier(0.4, 1.2, 0.5, 1), transform 0.25s cubic-bezier(0.4, 1.2, 0.5, 1);
}

.toggle-wrapper .toggle-input:checked:active ~ .toggle-knob,
.toggle-wrapper .toggle-input:checked:active ~ .toggle-track .toggle-knob,
.toggle-wrapper .toggle-input:checked:active + .toggle-track .toggle-knob {
    width: 28px;
    transform: translateX(15px) scale(1.26);
    transition: width 0.25s cubic-bezier(0.4, 1.2, 0.5, 1), transform 0.25s cubic-bezier(0.4, 1.2, 0.5, 1);
}

/* General Page Styling */
body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px;
    background-color: #f0f0f5; /* Light grey background to see shadows/elements nicely */
    display: flex;
    flex-direction: column;
    gap: 40px;
}

.component-section {
    display: flex;
    flex-direction: column;
    gap: 15px;
}
</style>
</head>
<body>

    <div class="component-section">
        <h3>Slider</h3>
        <input type="range" class="settings-slider" min="0" max="100" value="70" style="--value: 70%;" oninput="this.style.setProperty('--value', this.value + '%')">
    </div>

    <div class="component-section">
        <h3>Toggle Button</h3>
        <label class="toggle-wrapper">
            <input type="checkbox" class="toggle-input" checked>
            <div class="toggle-track"></div>
            <div class="toggle-knob"></div>
        </label>
        
        <label class="toggle-wrapper" style="margin-top: 10px;">
            <input type="checkbox" class="toggle-input">
            <div class="toggle-track"></div>
            <div class="toggle-knob"></div>
        </label>
    </div>

</body>
</html>
